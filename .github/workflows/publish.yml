# Publica en PyPI (Trusted Publishing, sin tokens) cada vez que se publica
# una release en GitHub, y adjunta los paquetes a esa misma release.
# Lanzado a mano (workflow_dispatch) solo construye y valida, sin publicar.
name: Publicar en PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de construcción
        run: python -m pip install --upgrade build twine sphinx

      - name: Comprobar que la etiqueta coincide con la versión de pyproject.toml
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de pyproject.toml"
            exit 1
          fi

      - name: Generar la ayuda de los widgets (Sphinx)
        run: python -m sphinx -b html doc orangecontrib/orange_gualbe_ts/_help/html

      - name: Construir el paquete
        run: python -m build

      - name: Validar el paquete
        run: |
          twine check dist/*
          unzip -l dist/*.whl | grep -q "_help/html/objects.inv"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/orange-gualbe-ts/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Adjuntar los paquetes a la release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
