[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orange_gualbe_ts"
version = "0.2.1"
description = "Widgets de utilidades para trabajar con series temporales en Orange Data Mining"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Gualberto", email = "gualbe@gmail.com"},
]
keywords = ["orange3 add-on", "time series", "series temporales"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "Orange3>=3.32.0",
    "Orange3-Timeseries>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/gualbe/orange_gualbe_ts"
Repository = "https://github.com/gualbe/orange_gualbe_ts"
Issues = "https://github.com/gualbe/orange_gualbe_ts/issues"

[project.entry-points."orange3.addon"]
orange_gualbe_ts = "orangecontrib.orange_gualbe_ts"

[project.entry-points."orange.widgets"]
"Utilidades de Series Temporales" = "orangecontrib.orange_gualbe_ts.widgets"

[project.entry-points."orange.canvas.help"]
intersphinx = "orangecontrib.orange_gualbe_ts.widgets:WIDGET_HELP_PATH"

[tool.setuptools.packages.find]
include = ["orangecontrib*"]
namespaces = true

[tool.setuptools.package-data]
"orangecontrib.orange_gualbe_ts.widgets" = ["icons/*.svg"]
"orangecontrib.orange_gualbe_ts" = ["_help/html/**/*"]
